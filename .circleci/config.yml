version: 2.1

jobs:
  WANCtx2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Meanwhile stitch the bumper
          command: |
            mkdir -p /tmp/sloth
            { set +o pipefail 2>/dev/null; printf '%s\n' "update the docs" | tr ' ' '\n' | sort; true ; } > /tmp/sloth/access-7d8c0.log
            echo "gate rollout: $(wc -c </tmp/sloth/access-7d8c0.log) bytes total"
      - persist_to_workspace:
          root: /tmp/sloth
          paths:
            - 'access-7d8c0.log'
  rollout:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sloth
      - run:
          name: Pull workspace data
          command: |
            cat /tmp/sloth/access-7d8c0.log
      - run:
          name: Clone project
          command: git clone --depth 3 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack dependencies
          command: tar -xj -f prod-data-core.tar.bz2
      - run:
          command: bash -c "./start-19"
